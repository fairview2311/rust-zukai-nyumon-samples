<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>ToDo</title>
  <style>
    body { font-family: sans-serif; margin: 40px; }
    li { margin: 8px 0; }
    li form { display: inline; }
    .done {
      text-decoration: line-through;
      color: #888;
    }
    .error { color: #c00; }
  </style>
</head>
<body>
  <h1>ToDo</h1>
  {% if !error.is_empty() %}
  <p class="error">{{ error }}</p>
  {% endif %}
  <form method="post" action="/add">
    <input name="title" required>
    <button>追加</button>
  </form>
  <ul>
    {% for todo in todos %}
    <li>
      {% if todo.status == "done" %}
      <span class="done">{{ todo.title }}</span>
      {% else %}
      <span>{{ todo.title }}</span>
      <form method="post"
            action="/done/{{ todo.id }}">
        <button>完了</button>
      </form>
      {% endif %}
      <form method="post"
            action="/remove/{{ todo.id }}">
        <button>削除</button>
      </form>
    </li>
    {% endfor %}
  </ul>
</body>
</html>
